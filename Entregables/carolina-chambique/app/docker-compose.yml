services:
  web:
    build: .
    ports: ["8000:8000"]
    environment:
      SECRET_KEY: ${SECRET_KEY:-desarrollo-local-solamente}
      DATABASE_URL: postgresql://clouddesk:clouddesk@db:5432/clouddesk
      UPLOAD_FOLDER: /data/uploads
      MAX_CONTENT_LENGTH: 10485760
    volumes: ["uploads:/data/uploads"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clouddesk
      POSTGRES_USER: clouddesk
      POSTGRES_PASSWORD: clouddesk
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clouddesk -d clouddesk"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
  uploads:
