<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}CloudDesk{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"></head><body><header class="topbar"><a class="brand" href="{{ url_for('index') }}"><span>☁</span> CloudDesk</a><nav><a href="{{ url_for('index') }}">Documentos</a><a class="button small" href="{{ url_for('upload') }}">+ Subir archivo</a></nav></header><main>{% for category, message in get_flashed_messages(with_categories=true) %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main><footer>CloudDesk · Espacio documental del equipo</footer></body></html>
