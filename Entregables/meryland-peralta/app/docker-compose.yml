services:
  db:
    image: postgres:16-alpine
    container_name: salonbook-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: salonbook
      POSTGRES_USER: salonbook
      POSTGRES_PASSWORD: salonbook_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./backend
    container_name: salonbook-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: salonbook
      DB_USER: salonbook
      DB_PASSWORD: salonbook_password
    ports:
      - "4000:4000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: salonbook-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
