<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Ingreso | OdontoGest</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container vh-100 d-flex justify-content-center align-items-center">

    <div class="card shadow-lg border-0 rounded-5 p-5" style="max-width:450px; width:100%;">

        <div class="text-center mb-4">

            <h1>🦷</h1>

            <h3 class="fw-bold text-primary">

                OdontoGest

            </h3>

            <p class="text-muted">

                Bienvenida nuevamente, Dra. Alejandra.

            </p>

            <small>

                Accedé a la gestión de tu consultorio.

            </small>

        </div>

        <form method="POST">>

            <div class="mb-3">

                <label class="form-label">

                    Usuario o correo electrónico

                </label>

                <input
                    type="text"
                    class="form-control form-control-lg"
                    name="usuario">

            </div>

            <div class="mb-4">

                <label class="form-label">

                    Contraseña

                </label>

                <input
                    type="password"
                    class="form-control form-control-lg"
                    name="password">

            </div>

            <button
type="submit"
class="btn btn-primary btn-lg w-100 rounded-pill">

Ingresar
{% if error %}

<div class="alert alert-danger">

    {{ error }}

</div>

{% endif %}

</button>

        </form>

        <hr>

        <small class="text-center text-muted">

            Acceso exclusivo para profesionales del consultorio.

        </small>

    </div>

</div>

</body>

</html>
