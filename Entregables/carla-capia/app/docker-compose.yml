services:
  app:
    build: .
    container_name: peluapp-app
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: peluapp
      DB_USER: peluapp
      DB_PASSWORD: peluapp_local
      JWT_SECRET: peluapp-local-secret-change-me
      ADMIN_USER: admin
      ADMIN_PASSWORD: peluapp2026
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: peluapp-db
    environment:
      MYSQL_DATABASE: peluapp
      MYSQL_USER: peluapp
      MYSQL_PASSWORD: peluapp_local
      MYSQL_ROOT_PASSWORD: root_local_change_me
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "peluapp", "-ppeluapp_local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mysql_data:
