<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Panel de Cuentas{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <p class="brand-name">Panel de Cuentas</p>
        <p class="brand-sub">Triage diario de salud y renovación</p>
      </div>
    </div>
    <a class="btn btn-primary" href="{{ url_for('nuevo_cliente') }}">+ Nueva cuenta</a>
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
