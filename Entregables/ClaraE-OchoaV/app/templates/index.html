<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SecureReport</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-danger text-white">
<h2>🛡 SecureReport</h2>
</div>

<div class="card-body">

<h3>Sistema de Reporte de Incidentes</h3>

<form action="/registrar" method="POST">

<div class="mb-3">

<label>Título</label>

<input
class="form-control"
name="titulo"
required>

</div>

<div class="mb-3">

<label>Descripción</label>

<textarea
class="form-control"
name="descripcion"
required></textarea>

</div>

<div class="mb-3">

<label>Severidad</label>

<select
class="form-select"
name="severidad">

<option>Alta</option>
<option>Media</option>
<option>Baja</option>

</select>

</div>

<button class="btn btn-danger">

Registrar Incidente

</button>

</form>

<hr>

<h4>Incidentes registrados</h4>

<table class="table table-striped">

<tr>

<th>Título</th>
<th>Descripción</th>
<th>Severidad</th>

</tr>

{% for incidente in incidentes %}

<tr>

<td>{{ incidente.titulo }}</td>
<td>{{ incidente.descripcion }}</td>
<td>{{ incidente.severidad }}</td>

</tr>

{% endfor %}

</table>

</div>

</div>

</div>

</body>
</html>
