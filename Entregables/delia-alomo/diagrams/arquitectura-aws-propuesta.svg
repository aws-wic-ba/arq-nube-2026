<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" font-family="'Segoe UI', Arial, sans-serif">
  
  <!-- Background -->
  <rect width="1100" height="900" fill="#FAFBFC"/>
  
  <!-- Title -->
  <text x="550" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#232F3E">ZeroToTech — Arquitectura AWS Propuesta</text>
  <text x="550" y="55" text-anchor="middle" font-size="12" fill="#545B64">Aplicación web educativa para orientar a personas en sus primeros pasos en IT</text>
  
  <!-- Legend -->
  <rect x="30" y="68" width="12" height="12" fill="#3F8624" rx="2"/>
  <text x="47" y="79" font-size="10" fill="#232F3E">Camino A: contenido estático (frontend React)</text>
  <rect x="350" y="68" width="12" height="12" fill="#ED7100" rx="2"/>
  <text x="367" y="79" font-size="10" fill="#232F3E">Camino B: operaciones dinámicas (backend serverless)</text>
  <rect x="700" y="68" width="12" height="12" fill="#DD344C" rx="2"/>
  <text x="717" y="79" font-size="10" fill="#232F3E">Flujo de autenticación (Cognito → JWT)</text>
  
  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- USUARIO (top center) -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="440" y="95" width="220" height="65" rx="8" fill="#FFFFFF" stroke="#232F3E" stroke-width="2"/>
  <text x="550" y="122" text-anchor="middle" font-size="22">👤</text>
  <text x="550" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#232F3E">Usuario (Browser / Móvil)</text>
  <text x="550" y="155" text-anchor="middle" font-size="8" fill="#6C757D">Accede a zerototech.app</text>
  
  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- CAMINO A: CONTENIDO ESTÁTICO (left) -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="30" y="200" width="280" height="250" rx="8" fill="#F1F3F5" stroke="#3F8624" stroke-width="1.5" stroke-dasharray="none"/>
  <text x="170" y="220" text-anchor="middle" font-size="11" font-weight="bold" fill="#3F8624" letter-spacing="1">CAMINO A: CONTENIDO ESTÁTICO</text>
  <text x="170" y="234" text-anchor="middle" font-size="8" fill="#6C757D">Entrega del frontend al navegador</text>
  
  <!-- CloudFront -->
  <rect x="60" y="250" width="220" height="75" rx="6" fill="#FFFFFF" stroke="#8C4FFF" stroke-width="1.5"/>
  <rect x="60" y="250" width="220" height="20" rx="6" fill="#8C4FFF"/>
  <rect x="60" y="260" width="220" height="10" fill="#8C4FFF"/>
  <text x="170" y="265" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFFFFF">Amazon CloudFront</text>
  <text x="170" y="288" text-anchor="middle" font-size="9" fill="#232F3E">CDN / Distribución global</text>
  <text x="170" y="301" text-anchor="middle" font-size="8" fill="#6C757D">Cachea y entrega la SPA con HTTPS</text>
  <text x="170" y="313" text-anchor="middle" font-size="8" fill="#6C757D">y baja latencia desde edge locations</text>
  
  <!-- S3 -->
  <rect x="60" y="345" width="220" height="90" rx="6" fill="#FFFFFF" stroke="#3F8624" stroke-width="1.5"/>
  <rect x="60" y="345" width="220" height="20" rx="6" fill="#3F8624"/>
  <rect x="60" y="355" width="220" height="10" fill="#3F8624"/>
  <text x="170" y="360" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFFFFF">Amazon S3</text>
  <text x="170" y="383" text-anchor="middle" font-size="9" fill="#232F3E">Hosting del frontend</text>
  <text x="170" y="397" text-anchor="middle" font-size="8" fill="#6C757D">Almacena el build de React + Vite:</text>
  <text x="170" y="410" text-anchor="middle" font-size="8" fill="#6C757D">HTML, JS, CSS, assets estáticos</text>
  <text x="170" y="423" text-anchor="middle" font-size="8" fill="#6C757D">(Hero, Test, Roadmap, Empresas, etc.)</text>
  
  <!-- Arrow: CloudFront → S3 -->
  <line x1="170" y1="325" x2="170" y2="343" stroke="#3F8624" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="190" y="337" font-size="7" fill="#3F8624">origen</text>
  
  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- AUTENTICACIÓN (center) -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="340" y="200" width="210" height="140" rx="8" fill="#F1F3F5" stroke="#DD344C" stroke-width="1.5"/>
  <text x="445" y="220" text-anchor="middle" font-size="11" font-weight="bold" fill="#DD344C" letter-spacing="1">AUTENTICACIÓN</text>
  <text x="445" y="234" text-anchor="middle" font-size="8" fill="#6C757D">Propuesta para habilitar cuentas</text>
  
  <!-- Cognito -->
  <rect x="360" y="248" width="170" height="78" rx="6" fill="#FFFFFF" stroke="#DD344C" stroke-width="1.5"/>
  <rect x="360" y="248" width="170" height="20" rx="6" fill="#DD344C"/>
  <rect x="360" y="258" width="170" height="10" fill="#DD344C"/>
  <text x="445" y="263" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFFFFF">Amazon Cognito</text>
  <text x="445" y="286" text-anchor="middle" font-size="9" fill="#232F3E">Registro / Login</text>
  <text x="445" y="299" text-anchor="middle" font-size="8" fill="#6C757D">Emite JWT al browser.</text>
  <text x="445" y="311" text-anchor="middle" font-size="8" fill="#6C757D">El token viaja con cada request</text>
  <text x="445" y="323" text-anchor="middle" font-size="8" fill="#6C757D">al backend para validación.</text>
  
  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- CAMINO B: BACKEND SERVERLESS (right) -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="580" y="200" width="280" height="250" rx="8" fill="#F1F3F5" stroke="#ED7100" stroke-width="1.5"/>
  <text x="720" y="220" text-anchor="middle" font-size="11" font-weight="bold" fill="#ED7100" letter-spacing="1">CAMINO B: BACKEND SERVERLESS</text>
  <text x="720" y="234" text-anchor="middle" font-size="8" fill="#6C757D">Operaciones dinámicas (propuestas)</text>
  
  <!-- API Gateway -->
  <rect x="610" y="250" width="220" height="75" rx="6" fill="#FFFFFF" stroke="#E7157B" stroke-width="1.5"/>
  <rect x="610" y="250" width="220" height="20" rx="6" fill="#E7157B"/>
  <rect x="610" y="260" width="220" height="10" fill="#E7157B"/>
  <text x="720" y="265" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFFFFF">Amazon API Gateway</text>
  <text x="720" y="288" text-anchor="middle" font-size="9" fill="#232F3E">Punto de entrada REST</text>
  <text x="720" y="301" text-anchor="middle" font-size="8" fill="#6C757D">Valida JWT de Cognito antes de</text>
  <text x="720" y="313" text-anchor="middle" font-size="8" fill="#6C757D">enrutar al backend</text>
  
  <!-- Lambda -->
  <rect x="610" y="345" width="220" height="90" rx="6" fill="#FFFFFF" stroke="#ED7100" stroke-width="1.5"/>
  <rect x="610" y="345" width="220" height="20" rx="6" fill="#ED7100"/>
  <rect x="610" y="355" width="220" height="10" fill="#ED7100"/>
  <text x="720" y="360" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFFFFF">AWS Lambda</text>
  <text x="720" y="383" text-anchor="middle" font-size="9" fill="#232F3E">Lógica de negocio serverless</text>
  <text x="720" y="397" text-anchor="middle" font-size="8" fill="#6C757D">Funciones propuestas:</text>
  <text x="720" y="410" text-anchor="middle" font-size="8" fill="#6C757D">• Evaluar test → calcular perfil IT</text>
  <text x="720" y="423" text-anchor="middle" font-size="8" fill="#6C757D">• Guardar/leer progreso y XP</text>
  
  <!-- Arrow: API Gateway → Lambda -->
  <line x1="720" y1="325" x2="720" y2="343" stroke="#ED7100" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  
  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- PERSISTENCIA (far right, below) -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="890" y="270" width="180" height="180" rx="8" fill="#F1F3F5" stroke="#C925D1" stroke-width="1.5"/>
  <text x="980" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#C925D1" letter-spacing="1">PERSISTENCIA</text>
  
  <!-- DynamoDB -->
  <rect x="910" y="305" width="140" height="130" rx="6" fill="#FFFFFF" stroke="#C925D1" stroke-width="1.5"/>
  <rect x="910" y="305" width="140" height="20" rx="6" fill="#C925D1"/>
  <rect x="910" y="315" width="140" height="10" fill="#C925D1"/>
  <text x="980" y="320" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFFFFF">Amazon DynamoDB</text>
  <text x="980" y="343" text-anchor="middle" font-size="9" fill="#232F3E">Base de datos NoSQL</text>
  <text x="980" y="360" text-anchor="middle" font-size="8" fill="#856404" font-style="italic">Modelo de datos propuesto:</text>
  <text x="980" y="376" text-anchor="middle" font-size="8" fill="#232F3E" font-weight="bold">Users</text>
  <text x="980" y="388" text-anchor="middle" font-size="8" fill="#6C757D">userId, email, perfil IT</text>
  <text x="980" y="404" text-anchor="middle" font-size="8" fill="#232F3E" font-weight="bold">Progress</text>
  <text x="980" y="416" text-anchor="middle" font-size="8" fill="#6C757D">completedNodes[], totalXP</text>
  <text x="980" y="432" text-anchor="middle" font-size="8" fill="#232F3E" font-weight="bold">QuizResults</text>
  
  <!-- Arrow: Lambda → DynamoDB -->
  <line x1="830" y1="390" x2="908" y2="375" stroke="#545B64" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="865" y="374" font-size="7" fill="#545B64">read/write</text>
  
  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- OBSERVABILIDAD (bottom center) -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="340" y="470" width="320" height="80" rx="8" fill="#F1F3F5" stroke="#DEE2E6" stroke-width="1.5"/>
  <text x="500" y="490" text-anchor="middle" font-size="11" font-weight="bold" fill="#495057" letter-spacing="1">OBSERVABILIDAD</text>
  
  <!-- CloudWatch -->
  <rect x="370" y="500" width="260" height="38" rx="6" fill="#FFFFFF" stroke="#E7157B" stroke-width="1.5"/>
  <rect x="370" y="500" width="260" height="16" rx="6" fill="#E7157B"/>
  <rect x="370" y="508" width="260" height="8" fill="#E7157B"/>
  <text x="500" y="512" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFFFFF">Amazon CloudWatch</text>
  <text x="500" y="530" text-anchor="middle" font-size="8" fill="#6C757D">Logs de Lambda + métricas de API Gateway (errores, latencia, invocaciones)</text>
  
  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- FLECHAS PRINCIPALES DE FLUJO -->
  <!-- ═══════════════════════════════════════════════════════ -->
  
  <!-- Arrow: Usuario → CloudFront (Path A - left) -->
  <path d="M 470 160 L 270 250" fill="none" stroke="#3F8624" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="345" y="195" font-size="8" fill="#3F8624" font-weight="bold">A: contenido estático</text>
  
  <!-- Arrow: Usuario → Cognito (center - auth) -->
  <line x1="550" y1="160" x2="445" y2="246" stroke="#DD344C" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>
  <text x="475" y="195" font-size="7" fill="#DD344C">registro/login</text>
  
  <!-- Arrow: Cognito JWT → API Gateway -->
  <path d="M 530 287 L 608 287" fill="none" stroke="#DD344C" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>
  <text x="569" y="280" font-size="7" fill="#DD344C">JWT token</text>
  
  <!-- Arrow: Usuario → API Gateway (Path B - right) -->
  <path d="M 630 160 L 720 248" fill="none" stroke="#ED7100" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="700" y="195" font-size="8" fill="#ED7100" font-weight="bold">B: Solicitudes API desde la SPA</text>
  
  <!-- Arrow: Lambda → CloudWatch (dashed) -->
  <path d="M 680 435 L 550 498" fill="none" stroke="#E7157B" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-pink)"/>
  <text x="630" y="470" font-size="7" fill="#E7157B">logs y métricas</text>
  
  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- Arrowhead definitions -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#545B64"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3F8624"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#DD344C"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ED7100"/>
    </marker>
    <marker id="arrow-pink" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#E7157B"/>
    </marker>
  </defs>
  
  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- SECCIÓN: Mapeo funcionalidad → servicio -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="30" y="575" width="1040" height="138" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1"/>
  <text x="550" y="595" text-anchor="middle" font-size="11" font-weight="bold" fill="#232F3E">MAPEO: FUNCIONALIDADES DE ZEROTOTECH → SERVICIOS AWS PROPUESTOS</text>
  
  <!-- Column headers -->
  <text x="60" y="617" font-size="9" font-weight="bold" fill="#495057">Funcionalidad de la app</text>
  <text x="370" y="617" font-size="9" font-weight="bold" fill="#495057">Cómo funciona hoy</text>
  <text x="620" y="617" font-size="9" font-weight="bold" fill="#495057">Cómo funcionaría en AWS</text>
  <text x="920" y="617" font-size="9" font-weight="bold" fill="#495057">Servicio</text>
  
  <line x1="50" y1="623" x2="1050" y2="623" stroke="#DEE2E6" stroke-width="0.5"/>
  
  <!-- Row 1 -->
  <text x="60" y="640" font-size="9" fill="#232F3E">Test de orientación (4 preguntas → perfil IT)</text>
  <text x="370" y="640" font-size="9" fill="#6C757D">Cálculo 100% en el browser (JS)</text>
  <text x="620" y="640" font-size="9" fill="#232F3E">Lambda evaluaría y persistiría resultado</text>
  <text x="920" y="640" font-size="9" fill="#ED7100">Lambda + DynamoDB</text>
  
  <!-- Row 2 -->
  <text x="60" y="660" font-size="9" fill="#232F3E">Progreso y XP (nodos completados, niveles)</text>
  <text x="370" y="660" font-size="9" fill="#6C757D">LocalStorage (pierde al cambiar device)</text>
  <text x="620" y="660" font-size="9" fill="#232F3E">Sync multi-dispositivo vía API + DB</text>
  <text x="920" y="660" font-size="9" fill="#C925D1">DynamoDB</text>
  
  <!-- Row 3 -->
  <text x="60" y="680" font-size="9" fill="#232F3E">Roadmap personalizado por perfil</text>
  <text x="370" y="680" font-size="9" fill="#6C757D">Datos estáticos embebidos en /data</text>
  <text x="620" y="680" font-size="9" fill="#232F3E">Lambda generaría roadmap dinámico</text>
  <text x="920" y="680" font-size="9" fill="#ED7100">Lambda</text>
  
  <!-- Row 4 -->
  <text x="60" y="700" font-size="9" fill="#232F3E">Cuentas de usuario (registro/login)</text>
  <text x="370" y="700" font-size="9" fill="#6C757D">No existe — uso anónimo</text>
  <text x="620" y="700" font-size="9" fill="#232F3E">Cognito manejaría auth completa</text>
  <text x="920" y="700" font-size="9" fill="#DD344C">Cognito</text>
  
  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- SECCIÓN: Flujo general -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="30" y="730" width="1040" height="108" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1"/>
  <text x="550" y="750" text-anchor="middle" font-size="11" font-weight="bold" fill="#232F3E">FLUJO GENERAL DE LA ARQUITECTURA PROPUESTA</text>
  
  <text x="60" y="773" font-size="9" fill="#232F3E">1. El usuario accede a zerototech.app → CloudFront entrega la SPA estática desde S3 (Camino A).</text>
  <text x="60" y="793" font-size="9" fill="#232F3E">2. Si se registra/inicia sesión, Cognito emite un JWT. El browser lo envía con cada petición al backend.</text>
  <text x="60" y="813" font-size="9" fill="#232F3E">3. Las operaciones dinámicas (guardar progreso, evaluar test) van por API Gateway → Lambda → DynamoDB (Camino B, independiente de S3).</text>
  <text x="60" y="833" font-size="9" fill="#232F3E">4. CloudWatch centraliza logs y métricas. No hay servidores que mantener: todo es serverless y escala con la demanda.</text>
  
  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- NOTA ACLARATORIA -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="30" y="850" width="1040" height="38" rx="6" fill="#FFF3CD" stroke="#FFC107" stroke-width="1"/>
  <text x="550" y="868" text-anchor="middle" font-size="9" font-weight="bold" fill="#856404">⚠️ IMPORTANTE: Este diagrama representa una arquitectura PROPUESTA. ZeroToTech actualmente está desplegada como SPA estática en Vercel,</text>
  <text x="550" y="882" text-anchor="middle" font-size="9" fill="#856404">sin backend ni base de datos en la nube. La migración a AWS habilitaría cuentas de usuario y sincronización de progreso entre dispositivos.</text>

</svg>
