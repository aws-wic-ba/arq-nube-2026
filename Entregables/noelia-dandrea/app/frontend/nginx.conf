server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Estaticos generados por el build (CSS, JS, imagenes): servidos directo por nginx
  location /assets/ {
    try_files $uri =404;
  }

  # Todo lo demas (paginas, rutas de la SPA) va al servidor Node (SSR)
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Proxy hacia la API (el navegador nunca habla directo con la base)
  location /api/ {
    proxy_pass http://api:3001/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /health {
    access_log off;
    return 200 "ok\n";
  }
}
