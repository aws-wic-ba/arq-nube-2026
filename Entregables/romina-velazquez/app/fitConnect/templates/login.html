<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitConnect - Iniciar Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-8 shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-orange-500 text-center">Iniciar Sesión</h2>
        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm text-slate-400 mb-1">Usuario</label>
                <input type="text" name="username" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-slate-100 focus:outline-none focus:border-orange-500">
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-1">Contraseña</label>
                <input type="password" name="password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-slate-100 focus:outline-none focus:border-orange-500">
            </div>
            <button type="submit" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-medium py-2 rounded-lg transition duration-200">Ingresar</button>
        </form>
        <p class="text-center text-sm text-slate-400 mt-4">¿No tenés cuenta? <a href="/register" class="text-orange-400 hover:underline">Registrate acá</a></p>
    </div>
</body>
</html>
