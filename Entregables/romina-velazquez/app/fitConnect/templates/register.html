<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitConnect - Registro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-8 shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-orange-500 text-center">Crear Cuenta</h2>
        
        <!-- Mensaje de error si las contraseñas no coinciden -->
        <div id="error-msg" class="hidden mb-4 bg-red-900/50 border border-red-500 text-red-200 text-xs p-3 rounded-lg text-center">
            Las contraseñas no coinciden. Por favor, verificá los datos.
        </div>

        <form id="register-form" action="/register" method="POST" class="space-y-4" onsubmit="return validarContrasenas(event)">
            <div>
                <label class="block text-sm text-slate-400 mb-1">DNI</label>
                <input type="number" name="username" placeholder="Ej: 35123456" required min="1000000" max="99999999"
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-slate-100 focus:outline-none focus:border-orange-500">
                <span class="text-[10px] text-slate-500">Ingrese solo números sin puntos.</span>
            </div>
            
            <div>
                <label class="block text-sm text-slate-400 mb-1">Correo electrónico</label>
                <input type="email" name="email" placeholder="usuario@correo.com" required 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-slate-100 focus:outline-none focus:border-orange-500">
            </div>
            
            <div>
                <label class="block text-sm text-slate-400 mb-1">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required minlength="6"
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-slate-100 focus:outline-none focus:border-orange-500">
            </div>

            <div>
                <label class="block text-sm text-slate-400 mb-1">Confirmar Contraseña</label>
                <input type="password" id="confirm_password" placeholder="••••••••" required minlength="6"
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-slate-100 focus:outline-none focus:border-orange-500">
            </div>

            <button type="submit" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-medium py-2 rounded-lg transition duration-200">
                Registrarse
            </button>
        </form>

        <p class="text-center text-sm text-slate-400 mt-4">¿Ya tenés cuenta? <a href="/login" class="text-orange-400 hover:underline">Iniciá sesión</a></p>
    </div>

    <!-- Script simple para validar que las contraseñas sean idénticas -->
    <script>
        function validarContrasenas(event) {
            const pass = document.getElementById('password').value;
            const confirmPass = document.getElementById('confirm_password').value;
            const errorDiv = document.getElementById('error-msg');

            if (pass !== confirmPass) {
                event.preventDefault(); // Evita que se envíe el formulario
                errorDiv.classList.remove('hidden');
                return false;
            }
            errorDiv.classList.add('hidden');
            return true;
        }
    </script>
</body>
</html>
