{% extends "base.html" %}{% block title %}{{ 'Editar' if unit else 'Nueva unidad' }} · OrganiCloud{% endblock %}{% block content %}<section class="page-heading"><div><p class="eyebrow">EDICIÓN CONTROLADA</p><h1>{{ 'Editar unidad' if unit else 'Nueva unidad' }}</h1><p>Cada modificación queda registrada en el historial.</p></div></section><form class="panel form" method="post"><label>Nombre<input required name="name" value="{{ unit.name if unit else '' }}"></label><div class="form-row"><label>Tipo<input required name="unit_type" value="{{ unit.unit_type if unit else 'Unidad' }}"></label><label>Estado<select name="status"><option value="vigente" {% if not unit or unit.status == 'vigente' %}selected{% endif %}>Vigente</option><option value="en revisión" {% if unit and unit.status == 'en revisión' %}selected{% endif %}>En revisión</option><option value="inactiva" {% if unit and unit.status == 'inactiva' %}selected{% endif %}>Inactiva</option></select></label></div><label>Depende de<select name="parent_id"><option value="">Sin dependencia (nivel principal)</option>{% for candidate in parents %}<option value="{{ candidate.id }}" {% if unit and unit.parent_id == candidate.id %}selected{% endif %}>{{ candidate.name }}</option>{% endfor %}</select></label><label>Misión<textarea required name="mission" rows="6">{{ unit.mission if unit else '' }}</textarea></label><label>Funciones <small>(una por línea)</small><textarea required name="functions" rows="10">{% if unit %}{% for f in unit.functions|sort(attribute='sort_order') %}{{ f.description }}{% if not loop.last %}
{% endif %}{% endfor %}{% endif %}</textarea></label><label>Motivo del cambio<input required name="change_note" placeholder="Ej.: Actualización aprobada por Resolución 12/2026"></label><div class="actions"><a class="button secondary" href="{{ url_for('unit_detail', unit_id=unit.id) if unit else url_for('dashboard') }}">Cancelar</a><button class="button">Guardar versión</button></div></form>{% endblock %}
