services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: actix_todo
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Las migraciones se ejecutan automáticamente la primera vez que
      # se crea el contenedor de Postgres (docker-entrypoint-initdb.d).
      - ./migrations/20220205163207_create_tasks_table.up.sql:/docker-entrypoint-initdb.d/01-create-tasks-table.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d actix_todo"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://todo:todo@db:5432/actix_todo
    ports:
      - "10000:10000"

volumes:
  db_data:
