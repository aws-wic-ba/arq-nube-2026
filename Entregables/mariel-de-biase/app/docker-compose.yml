version: "3.9"

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://appuser:apppass@db:5432/gastos_familia
      SECRET_KEY: clave-super-secreta-cambiar-en-produccion
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: gastos_familia
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d gastos_familia"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  db_data:
