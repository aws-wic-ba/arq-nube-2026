{% extends "base.html" %}
{% block title %}Ingresar{% endblock %}
{% block content %}
<div class="card">
    <h2>Ingresar</h2>
    <form method="POST">
        <label>Email</label>
        <input type="email" name="email" required>
        <label>Contraseña</label>
        <input type="password" name="password" required>
        <button type="submit">Entrar</button>
    </form>
</div>

    </ul>
</div>
{% endblock %}
