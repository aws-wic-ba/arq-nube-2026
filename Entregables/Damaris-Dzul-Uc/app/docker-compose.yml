services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: becas
      POSTGRES_PASSWORD: becas
      POSTGRES_DB: becas_hunucma
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U becas -d becas_hunucma"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: npm run dev
    environment:
      DATABASE_URL: postgres://becas:becas@db:5432/becas_hunucma
      PORT: 3000
      SESSION_SECRET: dev-only-secret-cambiar-en-produccion
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads
      - ./src:/app/src
      - ./public:/app/public
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  uploads_data:
